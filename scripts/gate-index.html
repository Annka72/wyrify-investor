<!doctype html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wyrify – Investor Deck</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #1B2A2E; color: #C8D5D0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    #login-gate { width: 100%; max-width: 320px; background: #223538; border: 1px solid #2E4245; border-radius: 8px; padding: 2rem; box-shadow: 0 4px 24px rgba(0,0,0,0.2); }
    #login-gate h1 { font-size: 1rem; letter-spacing: 0.15em; margin: 0 0 1.5rem; color: #E4EBE8; }
    #login-gate p { font-size: 0.85rem; color: #8A9E97; margin: 0 0 1.5rem; }
    #login-gate label { display: block; font-size: 0.75rem; color: #8A9E97; margin-bottom: 0.35rem; }
    #login-gate input { width: 100%; padding: 0.6rem 0.75rem; background: #192527; border: 1px solid #2E4245; border-radius: 6px; color: #C8D5D0; font-size: 0.95rem; margin-bottom: 1rem; }
    #login-gate .err { color: #e57373; font-size: 0.8rem; margin-bottom: 1rem; }
    #login-gate button { width: 100%; padding: 0.75rem; background: #4DB897; color: #FFFFFF; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    #login-gate .remember { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; cursor: pointer; font-size: 0.8rem; color: #8A9E97; }
    #login-gate .remember input { width: auto; margin: 0; cursor: pointer; accent-color: #4DB897; }
    #root { display: none; min-height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="login-gate">
    <h1>WYRIFY INVESTOR</h1>
    <p>Logg inn med brukernavn og passord du har fått.</p>
    <form id="login-form">
      <label>Brukernavn</label>
      <input type="text" name="username" autocomplete="username" required />
      <label>Passord</label>
      <input type="password" name="password" autocomplete="current-password" required />
      <label class="remember"><input type="checkbox" id="remember" /> Husk meg</label>
      <p class="err" id="err" style="display:none"></p>
      <button type="submit">Logg inn</button>
    </form>
  </div>
  <div id="root"></div>
  <script>
    (function() {
      var AUTH_KEY = 'wyrify_investor_auth';
      var USER = 'Wyrify';
      var PASS = 'Wyrify26';
      var APP_SCRIPT = '__APP_SCRIPT_SRC__';

      function showApp() {
        document.getElementById('login-gate').style.display = 'none';
        document.getElementById('root').style.display = 'block';
        document.body.style.display = 'block';
        document.body.style.padding = '0';
        var s = document.createElement('script');
        s.type = 'module';
        s.src = APP_SCRIPT;
        document.body.appendChild(s);
      }

      if (localStorage.getItem(AUTH_KEY) === '1' || sessionStorage.getItem(AUTH_KEY) === '1') {
        showApp();
        return;
      }

      document.getElementById('login-form').onsubmit = function(e) {
        e.preventDefault();
        var u = this.username.value.trim();
        var p = this.password.value;
        var errEl = document.getElementById('err');
        var remember = document.getElementById('remember').checked;
        if (u === USER && p === PASS) {
          if (remember) {
            localStorage.setItem(AUTH_KEY, '1');
          } else {
            sessionStorage.setItem(AUTH_KEY, '1');
          }
          showApp();
        } else {
          errEl.textContent = 'Feil brukernavn eller passord.';
          errEl.style.display = 'block';
        }
      };
    })();
  </script>
</body>
</html>
